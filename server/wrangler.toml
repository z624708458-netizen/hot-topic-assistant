name = "hot-topic-speech"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
MODEL_ENABLED = "false"
INTEL_MODEL_PROVIDER = "deepseek"
INTEL_MODEL_ENABLED = "false"
SOCIALDATAX_ENABLED = "false"
SOCIALDATAX_TERMS_CONFIRMED = "false"
SOCIALDATAX_BILLING_APPROVED = "false"
INTEL_AUTOMATION_ENABLED = "false"
INTEL_AUTO_RESEARCH = "false"
DOUYIN_ENABLED = "false"
DOUYIN_DATA_POLICY_CONFIRMED = "false"
ALLOWED_ORIGIN = "https://z624708458-netizen.github.io"
OPENAI_MODEL = "gpt-4.1-mini"

# DOUYIN_CLIENT_KEY, DOUYIN_CLIENT_SECRET, OPENAI_API_KEY and APP_ACCESS_TOKEN are secrets, configured only on the server.
# Never add secret values here or to browser assets. No account is created by this file.
[observability]
enabled = false

# V6: create D1 in your own account, run migrations, then add the binding below.
# Do not invent a database_id or overwrite an existing binding.
# [[d1_databases]]
# binding = "INTEL_DB"
# database_name = "hot-topic-intel"
# database_id = "<your-real-D1-id>"
# migrations_dir = "migrations"
# Optional after authorization: [triggers] crons = ["17 */6 * * *"]
